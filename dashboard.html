<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - GreenVest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="brand">MrSimon-Legit-Trade</h1>
    <nav>
      <a class="nav-link" href="index.html">Home</a>
    </nav>
  </header>

  <main class="container">
    <section class="dashboard">
      <h2>Check Investment</h2>
      <div class="card small">
        <input id="codeInput" placeholder="Enter investment code (e.g. INV10A)" />
        <button id="checkBtn">Check</button>
      </div>

      <div id="result" class="card result" hidden>
        <div id="resContent"></div>
        <div class="actions">
          <button id="withdrawBtn">Request Withdrawal</button>
        </div>
      </div>

      <div id="invalid" class="card invalid" hidden>Invalid Code</div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
